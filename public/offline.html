<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#e7ded3" />
<title>Offline · SDL</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#e7ded3;color:#404232;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;text-align:center;padding:24px}
  img{height:64px;margin:0 auto 18px;display:block}
  p{color:#616152;max-width:300px;margin:8px auto 22px;line-height:1.45}
  button{height:46px;padding:0 22px;border-radius:12px;border:0;background:#404232;color:#e7ded3;font-weight:600;font-size:15px}
</style>
</head>
<body>
  <div>
    <img src="/brand/logo-mark.svg" alt="SDL Creations" />
    <h1 style="font-size:20px;margin:0">No signal</h1>
    <p>You're offline right now. Anything you were typing in a daily log is kept on this phone – try again when you're back in range.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
