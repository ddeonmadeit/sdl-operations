<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Offline · SDL</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f6f4;color:#18211c;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;text-align:center;padding:24px}
  .b{width:56px;height:56px;border-radius:16px;background:#1f5c3d;color:#fff;font-weight:800;display:grid;place-items:center;margin:0 auto 16px}
  p{color:#6b756f;max-width:300px;margin:8px auto 20px;line-height:1.45}
  button{height:44px;padding:0 20px;border-radius:12px;border:0;background:#1f5c3d;color:#fff;font-weight:600;font-size:15px}
</style>
</head>
<body>
  <div>
    <div class="b">SDL</div>
    <h1 style="font-size:20px;margin:0">You're offline</h1>
    <p>No signal right now. Anything you were typing in a daily log is saved on this phone – reconnect and try again.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
